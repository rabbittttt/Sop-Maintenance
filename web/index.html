<!doctype html>

        <nav class="top-nav" aria-label="看板导航">
          <button class="nav-item active" type="button" data-page="planning" aria-current="page" aria-label="SOP计划" title="SOP计划"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4m8-4v4M8 13h3m2 0h3m-8 4h3m2 0h3"/></svg><span class="nav-label">SOP计划</span></button>

    <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
    <dialog id="edit-dialog" aria-labelledby="dialog-title">

      <div id="dialog-content"></div>
